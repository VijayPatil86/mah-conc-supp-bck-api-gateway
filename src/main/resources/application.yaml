app:
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    max-age: 3600
server:
  port: 8001
spring:
  application:
    name: mah-conc-supp-api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: mah-conc-supp-auth-service
            uri: lb://mah-conc-supp-auth-service
            predicates:
            - Path=/api/auth/**
            filters:
            - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG