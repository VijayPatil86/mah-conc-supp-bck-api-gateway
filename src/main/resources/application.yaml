jwt:
  public-key-location: file:C:/secure/jwt/jwt-public.pem
  issuer: mah-conc-supp-auth-service
  audience: mah-conc-supp-api
app:
  cors:
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    max-age: 3600
server:
  port: 8001
spring:
  http:
    clients:
      connect-timeout: 2000
      read-timeout: 10000
  config:
    import: file:C:/secure/mah-conc/eureka-client.properties
  application:
    name: mah-conc-supp-api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: mah-conc-supp-auth-service
            uri: lb://mah-conc-supp-auth-service
            predicates:
            - Path=/api/auth/**
            filters:
            - StripPrefix=1
          - id: mah-conc-supp-item-service
            uri: lb://mah-conc-supp-item-service
            predicates:
            - Path=/api/units/**, /api/items/**, /api/variants/**, /api/suppliers/*/variants/**
            filters:
            - StripPrefix=1
          - id: mah-conc-supp-supplier-service
            uri: lb://mah-conc-supp-supplier-service
            predicates:
            - Path=/api/suppliers/**
            filters:
            - StripPrefix=1
          - id: mah-conc-supp-bck-purchase-service
            uri: lb://mah-conc-supp-bck-purchase-service
            predicates:
            - Path=/api/purchase-vouchers/**, /api/vehicles/**
            filters:
            - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: http://${eureka.username}:${eureka.password}@localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${server.port}
logging:
  level:
    root: INFO
    com: INFO
    access: INFO
    org.springframework.security: WARN
    org.springframework.cloud.gateway: INFO
    com.netflix.discovery: WARN
    com.netflix.eureka: WARN
management:
  observations:
    annotations:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  health:
    diskspace:
      threshold: 1GB
